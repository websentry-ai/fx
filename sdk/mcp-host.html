<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Runs npm MCP servers for a browser host, one Web Worker per server. The page
  embeds this file in <iframe sandbox="allow-scripts">, so it has an opaque
  origin: the third-party code it runs cannot read the app's cookies, storage or
  APIs. It may load modules from esm.sh and fetch any HTTPS URL.

  Serve it from your own origin with `frame-ancestors 'self'`: a page that could
  frame it without the sandbox would run packages of its choosing in the
  visitor's browser. A meta CSP cannot carry that directive.
  It may also eval: the servers' own libraries do (es-module-lexer, ajv), and
  the code here is already the package's own.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://esm.sh; connect-src https:; worker-src blob:">
</head>
<body>
<script type="text/plain" id="server-worker">
// One npm MCP server, run the way `npx` runs it: the package's published files
// are unpacked onto an in-memory disk and loaded with their real file URLs; its
// dependencies come from esm.sh; Node's fs is that disk; stdin/stdout are
// postMessage.
const ESM = "https://esm.sh";
const BUILTINS = new Set(["assert", "async_hooks", "buffer", "child_process", "crypto", "dns", "events", "fs", "fs/promises", "http", "https", "module", "net", "os", "path", "perf_hooks", "process", "querystring", "readline", "sqlite", "stream", "string_decoder", "timers", "tls", "tty", "url", "util", "v8", "vm", "worker_threads", "zlib"]);
// Node modules no browser can back. Importing one works; calling it throws.
const NO_BROWSER = new Set(["child_process", "dns", "net", "sqlite", "tls", "v8", "vm", "worker_threads"]);

const blobUrl = (code) => URL.createObjectURL(new Blob([code], { type: "text/javascript" }));

function unavailable(name) {
  return blobUrl(`const fail = () => { throw new Error("node:${name} is not available in a browser"); };
const stub = new Proxy(fail, { get: (_, key) => (key === "then" ? undefined : stub), apply: fail, construct: fail });
export default stub;`);
}

async function unpackTarball(url, fs, root) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`downloading ${url} failed (${response.status})`);
  const tar = new Uint8Array(await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  const text = (from, length) => new TextDecoder().decode(tar.subarray(from, from + length)).replace(/\0.*$/s, "");
  for (let offset = 0; offset + 512 <= tar.length; ) {
    const name = text(offset, 100);
    if (!name) break;
    const size = parseInt(text(offset + 124, 12).trim() || "0", 8);
    const type = String.fromCharCode(tar[offset + 156] || 48);
    const prefix = text(offset + 345, 155);
    const path = (prefix ? `${prefix}/${name}` : name).replace(/^[^/]+\//, "");
    if (type === "0") {
      const target = `${root}/${path}`;
      fs.mkdirSync(target.replace(/\/[^/]+$/, ""), { recursive: true });
      fs.writeFileSync(target, tar.subarray(offset + 512, offset + 512 + size));
    }
    offset += 512 + Math.ceil(size / 512) * 512;
  }
}

async function start({ pkg, version, env, args }) {
  const [{ default: proc }, { EventEmitter }, { Buffer }, memfs, path, lexer] = await Promise.all([
    import(`${ESM}/node/process.mjs`),
    import(`${ESM}/node/events.mjs`),
    import(`${ESM}/node/buffer.mjs`),
    import(`${ESM}/memfs@4.78.0`),
    import(`${ESM}/node/path.mjs`).then((m) => m.default),
    import(`${ESM}/es-module-lexer@1.7.0`),
  ]);
  await lexer.init;

  const output = (kind) => Object.assign(new EventEmitter(), {
    isTTY: false,
    write(chunk, encoding, callback) {
      self.postMessage({ type: kind, text: typeof chunk === "string" ? chunk : new TextDecoder().decode(chunk) });
      (typeof encoding === "function" ? encoding : callback)?.();
      return true;
    },
  });
  const stdin = Object.assign(new EventEmitter(), {
    isTTY: false,
    resume() { return this; },
    pause() { return this; },
    setEncoding() { return this; },
  });
  // Every esm.sh polyfill shares this one process object, so patching it here
  // is what the server's StdioServerTransport reads.
  for (const [name, value] of [["stdin", stdin], ["stdout", output("stdout")], ["stderr", output("stderr")]]) {
    Object.defineProperty(proc, name, { value, configurable: true });
  }
  globalThis.process = proc;
  globalThis.Buffer = Buffer;
  globalThis.global = globalThis;
  proc.env = { ...env };
  proc.exit = (code) => self.postMessage({ type: "exit", code });
  // A server may do other work before it listens on stdin; hold its input until it does.
  const pending = [];
  const flush = () => {
    while (pending.length > 0 && stdin.listenerCount("data") > 0) stdin.emit("data", Buffer.from(pending.shift()));
  };
  stdin.on("newListener", (event) => event === "data" && queueMicrotask(flush));
  self.writeStdin = (line) => {
    pending.push(line);
    flush();
  };

  const { fs } = memfs.default.memfs({ "/tmp/.keep": "" }, "/");
  self.memoryDisk = fs;
  const root = `/node_modules/${pkg}`;
  const metaResponse = await fetch(`https://registry.npmjs.org/${pkg.replace("/", "%2f")}/${version}`);
  if (!metaResponse.ok) throw new Error(`${pkg}@${version} is not on npm (${metaResponse.status})`);
  const meta = await metaResponse.json();
  await unpackTarball(meta.dist.tarball, fs, root);
  const manifest = JSON.parse(fs.readFileSync(`${root}/package.json`, "utf8"));
  const bin = typeof manifest.bin === "string" ? manifest.bin : Object.values(manifest.bin ?? {})[0];
  if (!bin) throw new Error(`${pkg} has no command to run`);
  const entryPath = path.join(root, bin);
  proc.argv = ["node", entryPath, ...(args ?? [])];

  const fsKeys = Object.keys(fs).filter((key) => /^[A-Za-z_$][\w$]*$/.test(key));
  const shims = {
    fs: blobUrl(`const fs = self.memoryDisk; export default fs;\n${fsKeys.map((k) => `export const ${k} = fs.${k};`).join("\n")}`),
    "fs/promises": blobUrl(`const p = self.memoryDisk.promises; export default p;\n${Object.keys(fs.promises).map((k) => `export const ${k} = p.${k};`).join("\n")}`),
    // createRequire can read JSON off the disk, which is how packages find their own version.
    module: blobUrl(`import path from "${ESM}/node/path.mjs";
export function createRequire(from) {
  const base = path.dirname(String(from).replace(/^file:\\/\\//, ""));
  return (id) => {
    const file = id.startsWith("/") ? id : path.join(base, id);
    if (file.endsWith(".json")) return JSON.parse(self.memoryDisk.readFileSync(file, "utf8"));
    throw new Error("require(" + id + ") of code is not supported in a browser");
  };
}
export default { createRequire };`),
  };
  const builtinUrl = (name) => shims[name] ?? (NO_BROWSER.has(name) ? unavailable(name) : `${ESM}/node/${name}.mjs`);

  const dependencies = { ...manifest.dependencies };
  const dependencyUrl = (specifier) => {
    const parts = specifier.split("/");
    const name = specifier.startsWith("@") ? parts.slice(0, 2).join("/") : parts[0];
    const range = dependencies[name] ? `@${encodeURIComponent(dependencies[name])}` : "";
    return `${ESM}/${name}${range}${specifier.slice(name.length)}?target=es2022`;
  };
  const resolveFile = (from, specifier) => {
    const base = path.resolve(path.dirname(from), specifier);
    for (const candidate of [base, `${base}.js`, `${base}.mjs`, `${base}/index.js`]) {
      try { if (fs.statSync(candidate).isFile()) return candidate; } catch {}
    }
    throw new Error(`cannot resolve ${specifier} from ${from}`);
  };

  // The package's own files load from the disk, each with its real file URL.
  const loaded = new Map();
  const load = (file) => {
    if (!loaded.has(file)) {
      loaded.set(file, (async () => {
        let code = fs.readFileSync(file, "utf8");
        if (code.startsWith("#!")) code = `//${code}`;
        const [imports] = lexer.parse(code);
        let out = "";
        let cursor = 0;
        for (const entry of imports) {
          if (entry.d === -2) {
            out += code.slice(cursor, entry.s) +
              `({ url: ${JSON.stringify(`file://${file}`)}, filename: ${JSON.stringify(file)}, dirname: ${JSON.stringify(path.dirname(file))} })`;
            cursor = entry.e;
            continue;
          }
          const specifier = entry.n;
          if (specifier === undefined) continue;
          const bare = specifier.replace(/^node:/, "");
          const target = specifier.startsWith(".") || specifier.startsWith("/")
            ? await load(resolveFile(file, specifier))
            : BUILTINS.has(bare) ? builtinUrl(bare) : dependencyUrl(specifier);
          out += code.slice(cursor, entry.s) + (entry.d > -1 ? JSON.stringify(target) : target);
          cursor = entry.e;
        }
        return blobUrl(out + code.slice(cursor));
      })());
    }
    return loaded.get(file);
  };

  await import(await load(entryPath));
  self.postMessage({ type: "started" });
}

self.onmessage = ({ data }) => {
  if (data.type === "stdin") return self.writeStdin?.(data.line);
  if (data.type === "start") {
    start(data).catch((error) => self.postMessage({ type: "error", message: String(error?.message || error) }));
  }
};
</script>
<script>
// Relays each server between the page (over its MessagePort) and its worker.
const workerSource = URL.createObjectURL(new Blob([document.getElementById("server-worker").textContent], { type: "text/javascript" }));

window.addEventListener("message", (event) => {
  if (event.source !== window.parent || event.data?.type !== "start" || !event.ports[0]) return;
  const port = event.ports[0];
  // A classic worker: Chrome will not start a module worker from an opaque origin's
  // blob URL. The worker loads its modules with import(), which classic workers have.
  const worker = new Worker(workerSource);
  worker.onmessage = ({ data }) => port.postMessage(data);
  worker.onerror = (error) => port.postMessage({ type: "error", message: error.message || "the server crashed" });
  port.onmessage = ({ data }) => {
    if (data.type === "stop") {
      worker.terminate();
      port.close();
    } else {
      worker.postMessage(data);
    }
  };
  const { pkg, version, env, args } = event.data;
  worker.postMessage({ type: "start", pkg, version, env, args });
});

window.parent.postMessage({ type: "mcp-host-ready" }, "*");
</script>
</body>
</html>
